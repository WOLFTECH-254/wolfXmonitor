<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark green rounded background -->
  <rect width="180" height="180" rx="36" fill="#0a1a0d"/>
  <!-- Subtle grid lines for branding feel -->
  <line x1="0" y1="60" x2="180" y2="60" stroke="#22c55e" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="0" y1="90" x2="180" y2="90" stroke="#22c55e" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="0" y1="120" x2="180" y2="120" stroke="#22c55e" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="60" y1="0" x2="60" y2="180" stroke="#22c55e" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="90" y1="0" x2="90" y2="180" stroke="#22c55e" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="120" y1="0" x2="120" y2="180" stroke="#22c55e" stroke-opacity="0.07" stroke-width="1"/>
  <!-- Green glow circle behind bolt -->
  <circle cx="90" cy="90" r="52" fill="#22c55e" fill-opacity="0.10"/>
  <!-- Lightning bolt (Zap shape) — bold, centered -->
  <path
    d="M100 28 L58 96 L84 96 L80 152 L122 84 L96 84 Z"
    fill="#22c55e"
    stroke="#22c55e"
    stroke-width="1.5"
    stroke-linejoin="round"
  />
  <!-- Small dot below bolt for "monitoring pulse" feel -->
  <circle cx="90" cy="158" r="5" fill="#22c55e" fill-opacity="0.5"/>
</svg>
